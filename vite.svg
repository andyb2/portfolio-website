<!-- Save as: favicon.svg -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="A &amp; S favicon">
  <defs>
    <!-- Crisp edges + nice type rendering -->
    <style>
      text { font-family: ui-serif, Georgia, "Times New Roman", Times, serif; font-weight: 600; }
    </style>
  </defs>

  <!-- Background -->
  <circle cx="32" cy="32" r="30" fill="#0B0B0B" />

  <!-- Optional thin ring for “formal” vibe -->
  <circle cx="32" cy="32" r="27" fill="none" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="1.25"/>

  <!-- Monogram -->
  <text x="32" y="36.5" text-anchor="middle" font-size="20" fill="#FFFFFF" letter-spacing="0.5">
    A &amp; S
  </text>
</svg>
